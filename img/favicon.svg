<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="Le cahier de révisions">
  <!-- Le vert du tableau de la classe (variable CSS « ardoise »), pour que
       l'onglet se repère d'un coup d'œil dans une barre d'icônes claires. -->
  <rect width="32" height="32" rx="7" fill="#2f4a40"/>

  <!-- Le cahier, repris de .objet-cahier : page crème, reliure rouge. -->
  <rect x="7" y="6" width="18" height="20" rx="1.6" fill="#f6f2e5"/>
  <rect x="7" y="6" width="4.2" height="20" rx="1.6" fill="#b33f3f"/>

  <!-- Trois lignes d'écriture. À 16 px elles se fondent en une trame grise
       qui suffit à lire « un cahier », sans bouillie de détails. -->
  <g fill="#7f93a3">
    <rect x="13.6" y="11" width="8.6" height="1.5" rx=".75"/>
    <rect x="13.6" y="15.2" width="8.6" height="1.5" rx=".75"/>
    <rect x="13.6" y="19.4" width="5.6" height="1.5" rx=".75"/>
  </g>
</svg>
